spring.application.name=msvc-reportes
server.port=${MSVC_REPORTES_SERVER_PORT:8085}

# Database - NO DEFAULTS
spring.datasource.url=${MSVC_REPORTES_DB_URL}
spring.datasource.username=${MSVC_REPORTES_DB_USERNAME}
spring.datasource.password=${MSVC_REPORTES_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging defaults for dev
logging.level.com.grupodos.alquilervehiculos.msvcreportes=${MSVC_REPORTES_LOG_APP:DEBUG}
logging.level.org.springframework.web=${MSVC_REPORTES_LOG_SPRING_WEB:INFO}
logging.level.org.hibernate.SQL=${MSVC_REPORTES_LOG_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${MSVC_REPORTES_LOG_HIBERNATE_BINDER:TRACE}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_DEFAULT_ZONE:http://localhost:8761/eureka/}